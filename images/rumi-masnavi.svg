<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The Masnavi-ye Ma'navi</title>
<desc id="d">Diagram of Rumi's Masnavi: six stacked books with their famous tales, a four-step loop showing how stories lead to digressions, scripture and spiritual lessons, and a panel about the reed flute prologue.</desc>
<rect width="1200" height="780" fill="#faf6ee"/>
<rect x="8" y="8" width="1184" height="764" fill="none" stroke="#b88a44" stroke-width="1.5"/>
<text x="40" y="60" font-size="27" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">The Masnavi-ye Ma'navi: Rumi's Great Poem in Six Books</text>
<text x="40" y="88" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">A long Persian poem of rhymed couplets that teaches the path of the soul through stories</text>
<text x="50" y="128" font-size="18" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Six books (daftars)</text>
<rect x="50" y="146" width="350" height="48" rx="5" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="146" width="12" height="48" rx="3" fill="#8c3b2e"/>
<text x="76" y="166" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 1</text>
<text x="76" y="184.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">The reed · The parrot · The lion and the hare</text>
<rect x="50" y="204" width="350" height="48" rx="5" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="204" width="12" height="48" rx="3" fill="#8c3b2e"/>
<text x="76" y="224" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 2</text>
<text x="76" y="242.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Moses and the shepherd</text>
<rect x="50" y="262" width="350" height="48" rx="5" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="262" width="12" height="48" rx="3" fill="#8c3b2e"/>
<text x="76" y="282" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 3</text>
<text x="76" y="300.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">The elephant in the dark</text>
<rect x="50" y="320" width="350" height="48" rx="5" fill="#faf6ee" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="320" width="12" height="48" rx="3" fill="#b88a44"/>
<text x="76" y="340" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 4</text>
<text x="76" y="358.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">More tales, commentary and teaching</text>
<rect x="50" y="378" width="350" height="48" rx="5" fill="#faf6ee" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="378" width="12" height="48" rx="3" fill="#b88a44"/>
<text x="76" y="398" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 5</text>
<text x="76" y="416.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">More tales, commentary and teaching</text>
<rect x="50" y="436" width="350" height="48" rx="5" fill="#faf6ee" stroke="#5a3e1b" stroke-width="2.5"/>
<rect x="50" y="436" width="12" height="48" rx="3" fill="#b88a44"/>
<text x="76" y="456" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Book 6</text>
<text x="76" y="474.0" font-size="11.5" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">More tales, commentary and teaching</text>
<text x="50" y="520" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">About 25,000 couplets, composed over roughly</text>
<text x="50" y="538" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">the last 15 years of his life (from c. 1258).</text>
<text x="450" y="128" font-size="18" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">How the Masnavi moves: story within story</text>
<rect x="450" y="150" width="300" height="86" rx="10" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="466" y="180" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">1. A tale</text>
<text x="466" y="204.0" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">A fable, anecdote or scene from</text>
<text x="466" y="222.2" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">everyday life.</text>
<rect x="850" y="150" width="300" height="86" rx="10" fill="#f1e6cf" stroke="#3f5b73" stroke-width="3"/>
<text x="866" y="180" font-size="16" fill="#3f5b73" text-anchor="start" font-weight="bold" font-style="normal">2. A digression</text>
<text x="866" y="204.0" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">One image sparks a side-thought, then</text>
<text x="866" y="222.2" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">another.</text>
<rect x="850" y="320" width="300" height="86" rx="10" fill="#f1e6cf" stroke="#b88a44" stroke-width="3"/>
<text x="866" y="350" font-size="16" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">3. Scripture and saints</text>
<text x="866" y="374.0" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Qur'anic verses, hadith and Sufi</text>
<text x="866" y="392.2" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">sayings are woven in.</text>
<rect x="450" y="320" width="300" height="86" rx="10" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="3"/>
<text x="466" y="350" font-size="16" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">4. A lesson of the heart</text>
<text x="466" y="374.0" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">The story is read as an allegory of</text>
<text x="466" y="392.2" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">the soul.</text>
<line x1="750" y1="193" x2="841.0" y2="193.0" stroke="#5a3e1b" stroke-width="2.5"/><polygon points="850,193 841.0,197.9 841.0,188.1" fill="#5a3e1b"/>
<line x1="1000" y1="236" x2="1000.0" y2="311.0" stroke="#5a3e1b" stroke-width="2.5"/><polygon points="1000,320 995.0,311.0 1005.0,311.0" fill="#5a3e1b"/>
<line x1="850" y1="363" x2="759.0" y2="363.0" stroke="#5a3e1b" stroke-width="2.5"/><polygon points="750,363 759.0,358.1 759.0,367.9" fill="#5a3e1b"/>
<line x1="600" y1="320" x2="600.0" y2="245.0" stroke="#5a3e1b" stroke-width="2.5"/><polygon points="600,236 605.0,245.0 595.0,245.0" fill="#5a3e1b"/>
<text x="750" y="285" font-size="13" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">…and back to the tale</text>
<rect x="40" y="566" width="1120" height="124" rx="12" fill="#f1e6cf" stroke="#b88a44" stroke-width="2.5"/>
<rect x="64" y="612" width="150" height="14" rx="7" fill="#b88a44" stroke="#5a3e1b" stroke-width="2" transform="rotate(-18 139 619)"/>
<circle cx="100" cy="631.5" r="2.8" fill="#5a3e1b"/>
<circle cx="124" cy="623.8" r="2.8" fill="#5a3e1b"/>
<circle cx="148" cy="616.1" r="2.8" fill="#5a3e1b"/>
<circle cx="172" cy="608.4" r="2.8" fill="#5a3e1b"/>
<circle cx="196" cy="600.7" r="2.8" fill="#5a3e1b"/>
<text x="250" y="598" font-size="18" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">The prologue: the song of the reed (ney)</text>
<text x="250" y="624" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">The first 18 couplets open with a reed flute cut from its reed bed. Its music is a lament of</text>
<text x="250" y="644" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">separation, standing for the human soul longing to return to its source. Many readers take it as the</text>
<text x="250" y="664" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">keynote of the whole poem.</text>
<line x1="40" y1="716" x2="1160" y2="716" stroke="#b88a44" stroke-width="1"/>
<text x="40" y="742" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Tales are listed by book as they are usually cited; the six-book structure is Rumi's own division of the poem.</text>
</svg>
