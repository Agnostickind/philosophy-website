<rect x="524.2" y="771.0" width="191.5" height="58" rx="10" fill="#8c3b2e" stroke="#2b2118" stroke-width="1.5"/>
<text x="620" y="796.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Governmentality</text>
<text x="620" y="817.0" font-size="12.5" fill="#f3ead9" text-anchor="middle" font-weight="normal" font-style="italic">lectures, 1977–78</text>
