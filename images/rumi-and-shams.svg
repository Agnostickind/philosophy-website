<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Rumi and Shams of Tabriz</title>
<desc id="d">Diagram: Rumi on the left and Shams of Tabriz on the right, meeting at Konya in 1244, with summary boxes for before and after, and a timeline from Rumi's birth in 1207 to his death in 1273.</desc>
<rect width="1200" height="780" fill="#faf6ee"/>
<rect x="8" y="8" width="1184" height="764" fill="none" stroke="#b88a44" stroke-width="1.5"/>
<text x="40" y="60" font-size="27" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Rumi and Shams of Tabriz: The Meeting That Changed a Poet</text>
<text x="40" y="88" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">From respected Konya scholar to poet of longing and divine love (traditional date of the meeting: 30 November 1244)</text>
<circle cx="215" cy="240" r="88" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3.5"/>
<text x="215" y="236" font-size="30" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Rumi</text>
<text x="215" y="262" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Jalal ad-Din</text>
<circle cx="985" cy="240" r="88" fill="#f1e6cf" stroke="#3f5b73" stroke-width="3.5"/>
<text x="985" y="236" font-size="30" fill="#3f5b73" text-anchor="middle" font-weight="bold" font-style="normal">Shams</text>
<text x="985" y="262" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">of Tabriz</text>
<circle cx="600" cy="240" r="66" fill="#b88a44" stroke="#5a3e1b" stroke-width="3.5"/>
<text x="600" y="238" font-size="20" fill="#2b2118" text-anchor="middle" font-weight="bold" font-style="normal">Konya</text>
<text x="600" y="262" font-size="18" fill="#2b2118" text-anchor="middle" font-weight="bold" font-style="normal">1244</text>
<line x1="306" y1="240" x2="521.0" y2="240.0" stroke="#5a3e1b" stroke-width="2.5"/><polygon points="530,240 521.0,244.9 521.0,235.1" fill="#5a3e1b"/>
<line x1="894" y1="240" x2="679.0" y2="240.0" stroke="#3f5b73" stroke-width="2.5"/><polygon points="670,240 679.0,235.1 679.0,244.9" fill="#3f5b73"/>
<text x="415" y="205.0" font-size="13" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Teacher meets wanderer</text>
<text x="790" y="205.0" font-size="13" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Mirror and guide</text>
<rect x="40" y="372" width="360" height="172" rx="10" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="2"/>
<text x="58" y="402" font-size="18" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Before</text>
<circle cx="62" cy="424" r="3.5" fill="#5a3e1b"/>
<text x="76" y="428" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Born 1207; family settles in Konya c. 1228</text>
<circle cx="62" cy="450" r="3.5" fill="#5a3e1b"/>
<text x="76" y="454" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Takes over his late father's teaching post</text>
<text x="76" y="471" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">in 1231</text>
<circle cx="62" cy="493" r="3.5" fill="#5a3e1b"/>
<text x="76" y="497" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Known as a jurist, preacher and teacher</text>
<rect x="420" y="372" width="360" height="172" rx="10" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<text x="438" y="402" font-size="18" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">After</text>
<circle cx="442" cy="424" r="3.5" fill="#8c3b2e"/>
<text x="456" y="428" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Turns to poetry, music and the sama dance</text>
<circle cx="442" cy="450" r="3.5" fill="#8c3b2e"/>
<text x="456" y="454" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Divan-i Shams: over 3,000 lyric poems, many</text>
<text x="456" y="471" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">signed 'Shams'</text>
<circle cx="442" cy="493" r="3.5" fill="#8c3b2e"/>
<text x="456" y="497" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Later composes the six-book Masnavi</text>
<rect x="800" y="372" width="360" height="172" rx="10" fill="#f1e6cf" stroke="#3f5b73" stroke-width="2"/>
<text x="818" y="402" font-size="18" fill="#3f5b73" text-anchor="start" font-weight="bold" font-style="normal">Shams</text>
<circle cx="822" cy="424" r="3.5" fill="#3f5b73"/>
<text x="836" y="428" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Wandering Sufi from Tabriz, of unknown age</text>
<circle cx="822" cy="450" r="3.5" fill="#3f5b73"/>
<text x="836" y="454" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Disappears c. 1247; circumstances unclear,</text>
<text x="836" y="471" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">tradition says he was killed</text>
<circle cx="822" cy="493" r="3.5" fill="#3f5b73"/>
<text x="836" y="497" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Rumi's grief becomes longing in his verse</text>
<line x1="70" y1="642" x2="1130" y2="642" stroke="#5a3e1b" stroke-width="3"/>
<circle cx="95.0" cy="642" r="9" fill="#5a3e1b" stroke="#faf6ee" stroke-width="2"/>
<text x="95.0" y="624" font-size="15" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">1207</text>
<text x="95.0" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Born, traditionally</text>
<text x="95.0" y="685" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">at Balkh</text>
<circle cx="263.3" cy="642" r="9" fill="#5a3e1b" stroke="#faf6ee" stroke-width="2"/>
<text x="263.3" y="624" font-size="15" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">c. 1228</text>
<text x="263.3" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Family settles in</text>
<text x="263.3" y="685" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Konya</text>
<circle cx="431.6" cy="642" r="9" fill="#5a3e1b" stroke="#faf6ee" stroke-width="2"/>
<text x="431.6" y="624" font-size="15" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">1231</text>
<text x="431.6" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Succeeds his father</text>
<text x="431.6" y="685" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">as teacher</text>
<circle cx="599.9" cy="642" r="9" fill="#8c3b2e" stroke="#faf6ee" stroke-width="2"/>
<text x="599.9" y="624" font-size="15" fill="#8c3b2e" text-anchor="middle" font-weight="bold" font-style="normal">1244</text>
<text x="599.9" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Meets Shams</text>
<circle cx="768.2" cy="642" r="9" fill="#8c3b2e" stroke="#faf6ee" stroke-width="2"/>
<text x="768.2" y="624" font-size="15" fill="#8c3b2e" text-anchor="middle" font-weight="bold" font-style="normal">c. 1247</text>
<text x="768.2" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Shams disappears</text>
<circle cx="936.5" cy="642" r="9" fill="#5a3e1b" stroke="#faf6ee" stroke-width="2"/>
<text x="936.5" y="624" font-size="15" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">c. 1258</text>
<text x="936.5" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Begins the Masnavi</text>
<circle cx="1104.8" cy="642" r="9" fill="#5a3e1b" stroke="#faf6ee" stroke-width="2"/>
<text x="1104.8" y="624" font-size="15" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">1273</text>
<text x="1104.8" y="670" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Dies in Konya, 17</text>
<text x="1104.8" y="685" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Dec</text>
<line x1="40" y1="716" x2="1160" y2="716" stroke="#b88a44" stroke-width="1"/>
<text x="40" y="742" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Dates before 1244 and the details of Shams's end come from later tradition; scholars treat them with caution.</text>
</svg>
