<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Saptanga: the seven limbs of the state (Kautilya)</title>
<desc id="d">Wheel diagram: a central circle labelled Rajya, the state, joined to seven numbered nodes: Svami the king, Amatya ministers, Janapada land and people, Durga forts, Kosha treasury, Danda army, and Mitra allies, with a list explaining each limb.</desc>
<rect width="1200" height="780" fill="#faf6ee"/>
<rect x="8" y="8" width="1184" height="764" fill="none" stroke="#b88a44" stroke-width="1.5"/>
<text x="40" y="60" font-size="27" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Saptanga: The Seven Limbs of the State</text>
<text x="40" y="88" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Kautilya's model of what makes a kingdom (Arthashastra, Book 6): a state is a body, and every limb must be sound</text>
<circle cx="370" cy="440" r="235" fill="none" stroke="#b88a44" stroke-width="1.5" stroke-dasharray="4 6"/>
<line x1="370" y1="440" x2="370.0" y2="205.0" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="553.7" y2="293.5" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="599.1" y2="492.3" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="472.0" y2="651.7" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="268.0" y2="651.7" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="140.9" y2="492.3" stroke="#5a3e1b" stroke-width="2"/>
<line x1="370" y1="440" x2="186.3" y2="293.5" stroke="#5a3e1b" stroke-width="2"/>
<circle cx="370" cy="440" r="78" fill="#5a3e1b" stroke="#b88a44" stroke-width="4"/>
<text x="370" y="436" font-size="24" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">Rajya</text>
<text x="370" y="460" font-size="14" fill="#f1e6cf" text-anchor="middle" font-weight="normal" font-style="italic">the state</text>
<circle cx="370.0" cy="205.0" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="370.0" y="202.0" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Svami</text>
<text x="370.0" y="221.0" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">The king</text>
<circle cx="329.7" cy="164.7" r="13" fill="#8c3b2e"/>
<text x="329.7" y="169.7" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<circle cx="553.7" cy="293.5" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="553.7" y="290.5" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Amatya</text>
<text x="553.7" y="309.5" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Ministers</text>
<circle cx="513.4" cy="253.2" r="13" fill="#8c3b2e"/>
<text x="513.4" y="258.2" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<circle cx="599.1" cy="492.3" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="599.1" y="489.3" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Janapada</text>
<text x="599.1" y="508.3" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Land &amp; people</text>
<circle cx="558.8" cy="452.0" r="13" fill="#8c3b2e"/>
<text x="558.8" y="457.0" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<circle cx="472.0" cy="651.7" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="472.0" y="648.7" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Durga</text>
<text x="472.0" y="667.7" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Forts</text>
<circle cx="431.6" cy="611.4" r="13" fill="#8c3b2e"/>
<text x="431.6" y="616.4" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<circle cx="268.0" cy="651.7" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="268.0" y="648.7" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Kosha</text>
<text x="268.0" y="667.7" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Treasury</text>
<circle cx="227.7" cy="611.4" r="13" fill="#8c3b2e"/>
<text x="227.7" y="616.4" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<circle cx="140.9" cy="492.3" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="140.9" y="489.3" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Danda</text>
<text x="140.9" y="508.3" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Army / force</text>
<circle cx="100.6" cy="452.0" r="13" fill="#8c3b2e"/>
<text x="100.6" y="457.0" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<circle cx="186.3" cy="293.5" r="56" fill="#f1e6cf" stroke="#5a3e1b" stroke-width="3"/>
<text x="186.3" y="290.5" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Mitra</text>
<text x="186.3" y="309.5" font-size="12" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Allies</text>
<circle cx="145.9" cy="253.2" r="13" fill="#8c3b2e"/>
<text x="145.9" y="258.2" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">7</text>
<text x="730" y="140" font-size="18" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">The seven limbs, in Kautilya's order</text>
<line x1="730" y1="150" x2="1160" y2="150" stroke="#b88a44" stroke-width="1.5"/>
<circle cx="743" cy="179" r="13" fill="#8c3b2e"/>
<text x="743" y="184" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">1</text>
<text x="768" y="184" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Svami (The king)</text>
<text x="768" y="203.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Capable, trained, disciplined ruler; the head of the</text>
<text x="768" y="221.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">state.</text>
<circle cx="743" cy="245" r="13" fill="#8c3b2e"/>
<text x="743" y="250" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">2</text>
<text x="768" y="250" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Amatya (Ministers)</text>
<text x="768" y="269.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Officials and counsellors who run administration and</text>
<text x="768" y="287.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">advise the king.</text>
<circle cx="743" cy="311" r="13" fill="#8c3b2e"/>
<text x="743" y="316" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">3</text>
<text x="768" y="316" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Janapada (Land &amp; people)</text>
<text x="768" y="335.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Productive territory and a loyal, working</text>
<text x="768" y="353.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">population.</text>
<circle cx="743" cy="377" r="13" fill="#8c3b2e"/>
<text x="743" y="382" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">4</text>
<text x="768" y="382" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Durga (Forts)</text>
<text x="768" y="401.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Fortified strongholds (water, hill, desert, forest)</text>
<text x="768" y="419.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">for defence.</text>
<circle cx="743" cy="443" r="13" fill="#8c3b2e"/>
<text x="743" y="448" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">5</text>
<text x="768" y="448" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Kosha (Treasury)</text>
<text x="768" y="467.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Stored wealth: the basis for paying army, officials</text>
<text x="768" y="485.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">and projects.</text>
<circle cx="743" cy="509" r="13" fill="#8c3b2e"/>
<text x="743" y="514" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">6</text>
<text x="768" y="514" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Danda (Army / force)</text>
<text x="768" y="533.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Military and the power to enforce order and law.</text>
<circle cx="743" cy="575" r="13" fill="#8c3b2e"/>
<text x="743" y="580" font-size="14" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">7</text>
<text x="768" y="580" font-size="15" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Mitra (Allies)</text>
<text x="768" y="599.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">Friendly states that add strength and support in</text>
<text x="768" y="617.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">need.</text>
<line x1="40" y1="716" x2="1160" y2="716" stroke="#b88a44" stroke-width="1"/>
<text x="40" y="742" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Kautilya argues that a calamity in an earlier limb is worse than one in a later limb, so the king and ministers matter most.</text>
</svg>
