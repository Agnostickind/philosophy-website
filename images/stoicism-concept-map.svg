<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Stoicism concept map: virtue, the dichotomy of control and three disciplines</title>
<desc id="d">Concept map of Stoic ethics. The four cardinal virtues of wisdom, justice, courage and temperance lead to eudaimonia, a good flow of life. Below, the dichotomy of control separates what is up to us from what is not, and three disciplines of desire, assent and action put the theory into practice.</desc>
<rect width="1400" height="800" fill="#faf6ee"/>
<rect x="8" y="8" width="1384" height="784" fill="none" stroke="#b88a44" stroke-width="1.5"/>

<text x="40" y="62" font-size="29" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Stoicism: The Core Framework</text>
<text x="40" y="90" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">The four virtues, the dichotomy of control and three disciplines of practice</text>
<line x1="190" y1="220" x2="535.5" y2="301" stroke="#3f5b73" stroke-width="2.5"/>
<line x1="530" y1="220" x2="635" y2="262" stroke="#8c3b2e" stroke-width="2.5"/>
<line x1="870" y1="220" x2="765" y2="262" stroke="#5b6b3a" stroke-width="2.5"/>
<line x1="1210" y1="220" x2="864.5" y2="301" stroke="#6a4c7d" stroke-width="2.5"/>
<rect x="40" y="120" width="300" height="100" fill="#f1e6cf" stroke="#3f5b73" stroke-width="2"/>
<rect x="40" y="120" width="300" height="7" fill="#3f5b73"/>
<text x="190" y="154" font-size="21" fill="#3f5b73" text-anchor="middle" font-weight="bold" font-style="italic">Wisdom</text>
<text x="190" y="173" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">phronēsis</text>
<text x="190" y="195" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Knowing what is good, bad,</text>
<text x="190" y="212" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">and indifferent</text>
<rect x="380" y="120" width="300" height="100" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<rect x="380" y="120" width="300" height="7" fill="#8c3b2e"/>
<text x="530" y="154" font-size="21" fill="#8c3b2e" text-anchor="middle" font-weight="bold" font-style="italic">Justice</text>
<text x="530" y="173" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">dikaiosynē</text>
<text x="530" y="195" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Giving each person their due,</text>
<text x="530" y="212" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">acting for the common good</text>
<rect x="720" y="120" width="300" height="100" fill="#f1e6cf" stroke="#5b6b3a" stroke-width="2"/>
<rect x="720" y="120" width="300" height="7" fill="#5b6b3a"/>
<text x="870" y="154" font-size="21" fill="#5b6b3a" text-anchor="middle" font-weight="bold" font-style="italic">Courage</text>
<text x="870" y="173" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">andreia</text>
<text x="870" y="195" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Facing fear, pain and</text>
<text x="870" y="212" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">hardship with steadiness</text>
<rect x="1060" y="120" width="300" height="100" fill="#f1e6cf" stroke="#6a4c7d" stroke-width="2"/>
<rect x="1060" y="120" width="300" height="7" fill="#6a4c7d"/>
<text x="1210" y="154" font-size="21" fill="#6a4c7d" text-anchor="middle" font-weight="bold" font-style="italic">Temperance</text>
<text x="1210" y="173" font-size="14" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">sōphrosynē</text>
<text x="1210" y="195" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Self-command and moderation</text>
<text x="1210" y="212" font-size="14" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">in desire and pleasure</text>
<line x1="605" y1="421" x2="350" y2="460" stroke="#5b6b3a" stroke-width="2.5"/>
<line x1="795" y1="421" x2="1050" y2="460" stroke="#8c3b2e" stroke-width="2.5"/>
<ellipse cx="700" cy="345" rx="190" ry="88" fill="#5a3e1b" stroke="#b88a44" stroke-width="3"/>
<text x="700" y="335" font-size="26" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="italic">Eudaimonia</text>
<text x="700" y="360" font-size="16" fill="#e9d9b8" text-anchor="middle" font-weight="normal" font-style="italic">a good flow of life</text>
<text x="700" y="385" font-size="16" fill="#faf6ee" text-anchor="middle" font-weight="normal" font-style="normal">Virtue is the only true good</text>
<rect x="40" y="460" width="620" height="180" fill="#f1e6cf" stroke="#5b6b3a" stroke-width="2"/>
<rect x="40" y="460" width="620" height="7" fill="#5b6b3a"/>
<text x="64" y="495" font-size="21" fill="#5b6b3a" text-anchor="start" font-weight="bold" font-style="normal">UP TO US</text>
<text x="64" y="515" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Where choice, effort and virtue live</text>
<circle cx="70" cy="541" r="4" fill="#5b6b3a"/><text x="86" y="546" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Our judgments and opinions</text>
<circle cx="70" cy="563" r="4" fill="#5b6b3a"/><text x="86" y="568" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Our impulses and intentions</text>
<circle cx="70" cy="585" r="4" fill="#5b6b3a"/><text x="86" y="590" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Our desires and aversions</text>
<circle cx="70" cy="607" r="4" fill="#5b6b3a"/><text x="86" y="612" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Our own actions and choices</text>
<circle cx="70" cy="629" r="4" fill="#5b6b3a"/><text x="86" y="634" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">How we respond to events</text>
<rect x="740" y="460" width="620" height="180" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<rect x="740" y="460" width="620" height="7" fill="#8c3b2e"/>
<text x="764" y="495" font-size="21" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">NOT UP TO US</text>
<text x="764" y="515" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Accept these; act well regardless</text>
<circle cx="770" cy="541" r="4" fill="#8c3b2e"/><text x="786" y="546" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Our body, health and death</text>
<circle cx="770" cy="563" r="4" fill="#8c3b2e"/><text x="786" y="568" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Reputation and status</text>
<circle cx="770" cy="585" r="4" fill="#8c3b2e"/><text x="786" y="590" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Wealth and property</text>
<circle cx="770" cy="607" r="4" fill="#8c3b2e"/><text x="786" y="612" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Other people's actions</text>
<circle cx="770" cy="629" r="4" fill="#8c3b2e"/><text x="786" y="634" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Outcomes and chance events</text>
<text x="40" y="668" font-size="15" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Three disciplines of practice (Epictetus, as read by Pierre Hadot)</text>
<rect x="40" y="680" width="420" height="78" fill="#f1e6cf" stroke="#b88a44"/>
<text x="58" y="705" font-size="17" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">1. Desire</text>
<text x="58" y="727" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Want only what is up to you and</text>
<text x="58" y="745" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">accept the rest calmly.</text>
<rect x="490" y="680" width="420" height="78" fill="#f1e6cf" stroke="#b88a44"/>
<text x="508" y="705" font-size="17" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">2. Assent</text>
<text x="508" y="727" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Test each impression before agreeing:</text>
<text x="508" y="745" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">is it true, and is it up to me?</text>
<rect x="940" y="680" width="420" height="78" fill="#f1e6cf" stroke="#b88a44"/>
<text x="958" y="705" font-size="17" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">3. Action</text>
<text x="958" y="727" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Act with duty to others and the</text>
<text x="958" y="745" font-size="14" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">community, as a citizen of the world.</text>
<text x="1376" y="782" font-size="13" fill="#7a6a55" text-anchor="end">© The Great Library of Philosophy · libraryofphilosophy.com</text>
</svg>
