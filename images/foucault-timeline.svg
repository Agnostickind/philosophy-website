<title id="t">Michel Foucault timeline</title>
<desc id="d">Timeline of Michel Foucault's life and major works from his birth in 1926 to the posthumous publication of Confessions of the Flesh in 2018, colour-coded by archaeological, genealogical and ethical periods.</desc>
