<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Stoicism timeline</title>
<desc id="d">Timeline of Stoicism from Zeno of Citium founding the school in Athens around 300 BCE, through the Roman Stoics Seneca, Epictetus and Marcus Aurelius, to its revival in the Renaissance and its influence on modern therapy and popular philosophy, colour-coded by period.</desc>
<rect width="1400" height="700" fill="#faf6ee"/>
<rect x="8" y="8" width="1384" height="684" fill="none" stroke="#b88a44" stroke-width="1.5"/>

<text x="40" y="62" font-size="29" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Stoicism: A Timeline from Athens to Today</text>
<text x="40" y="90" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Events are evenly spaced for readability, not drawn to scale</text>
<line x1="40" y1="360" x2="1360" y2="360" stroke="#5a3e1b" stroke-width="4"/>
<line x1="95.0" y1="360" x2="95.0" y2="298" stroke="#3f5b73" stroke-width="2"/>
<circle cx="95.0" cy="360" r="11" fill="#3f5b73" stroke="#2b2118" stroke-width="2"/>
<text x="95.0" y="203.5" font-size="22" fill="#3f5b73" text-anchor="middle" font-weight="bold" font-style="normal">c. 300 BCE</text>
<text x="95.0" y="227.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Zeno of Citium</text>
<text x="95.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">founds the Stoa</text>
<text x="95.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">in Athens</text>
<line x1="216.0" y1="360" x2="216.0" y2="404" stroke="#3f5b73" stroke-width="2"/>
<circle cx="216.0" cy="360" r="11" fill="#3f5b73" stroke="#2b2118" stroke-width="2"/>
<text x="216.0" y="434" font-size="22" fill="#3f5b73" text-anchor="middle" font-weight="bold" font-style="normal">c. 230 BCE</text>
<text x="216.0" y="458.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Chrysippus becomes</text>
<text x="216.0" y="476.8" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">head of the school and</text>
<text x="216.0" y="495.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">systematizes its logic</text>
<line x1="337.0" y1="360" x2="337.0" y2="298" stroke="#8c3b2e" stroke-width="2"/>
<circle cx="337.0" cy="360" r="11" fill="#8c3b2e" stroke="#2b2118" stroke-width="2"/>
<text x="337.0" y="203.5" font-size="22" fill="#8c3b2e" text-anchor="middle" font-weight="bold" font-style="normal">155 BCE</text>
<text x="337.0" y="227.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Diogenes of Babylon</text>
<text x="337.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">visits Rome on an</text>
<text x="337.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Athenian embassy</text>
<line x1="458.0" y1="360" x2="458.0" y2="404" stroke="#8c3b2e" stroke-width="2"/>
<circle cx="458.0" cy="360" r="11" fill="#8c3b2e" stroke="#2b2118" stroke-width="2"/>
<text x="458.0" y="434" font-size="22" fill="#8c3b2e" text-anchor="middle" font-weight="bold" font-style="normal">44 BCE</text>
<text x="458.0" y="458.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Cicero writes On Duties,</text>
<text x="458.0" y="476.8" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">drawing on Panaetius</text>
<line x1="579.0" y1="360" x2="579.0" y2="298" stroke="#5b6b3a" stroke-width="2"/>
<circle cx="579.0" cy="360" r="11" fill="#5b6b3a" stroke="#2b2118" stroke-width="2"/>
<text x="579.0" y="222.2" font-size="22" fill="#5b6b3a" text-anchor="middle" font-weight="bold" font-style="normal">c. 62–65 CE</text>
<text x="579.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Seneca writes Letters</text>
<text x="579.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">to Lucilius; dies 65 CE</text>
<line x1="700.0" y1="360" x2="700.0" y2="404" stroke="#5b6b3a" stroke-width="2"/>
<circle cx="700.0" cy="360" r="11" fill="#5b6b3a" stroke="#2b2118" stroke-width="2"/>
<text x="700.0" y="434" font-size="22" fill="#5b6b3a" text-anchor="middle" font-weight="bold" font-style="normal">c. 100 CE</text>
<text x="700.0" y="458.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Epictetus teaches at</text>
<text x="700.0" y="476.8" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Nicopolis; Arrian</text>
<text x="700.0" y="495.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">records his Discourses</text>
<line x1="821.0" y1="360" x2="821.0" y2="298" stroke="#5b6b3a" stroke-width="2"/>
<circle cx="821.0" cy="360" r="11" fill="#5b6b3a" stroke="#2b2118" stroke-width="2"/>
<text x="821.0" y="203.5" font-size="22" fill="#5b6b3a" text-anchor="middle" font-weight="bold" font-style="normal">c. 170–180 CE</text>
<text x="821.0" y="227.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Marcus Aurelius writes</text>
<text x="821.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">the Meditations</text>
<text x="821.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">while on campaign</text>
<line x1="942.0" y1="360" x2="942.0" y2="404" stroke="#6a4c7d" stroke-width="2"/>
<circle cx="942.0" cy="360" r="11" fill="#6a4c7d" stroke="#2b2118" stroke-width="2"/>
<text x="942.0" y="434" font-size="22" fill="#6a4c7d" text-anchor="middle" font-weight="bold" font-style="normal">1584</text>
<text x="942.0" y="458.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Justus Lipsius</text>
<text x="942.0" y="476.8" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">publishes On Constancy,</text>
<text x="942.0" y="495.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">reviving Stoicism</text>
<line x1="1063.0" y1="360" x2="1063.0" y2="298" stroke="#6a4c7d" stroke-width="2"/>
<circle cx="1063.0" cy="360" r="11" fill="#6a4c7d" stroke="#2b2118" stroke-width="2"/>
<text x="1063.0" y="203.5" font-size="22" fill="#6a4c7d" text-anchor="middle" font-weight="bold" font-style="normal">1955</text>
<text x="1063.0" y="227.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Albert Ellis develops</text>
<text x="1063.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">rational emotive therapy,</text>
<text x="1063.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">citing the Stoics</text>
<line x1="1184.0" y1="360" x2="1184.0" y2="404" stroke="#6a4c7d" stroke-width="2"/>
<circle cx="1184.0" cy="360" r="11" fill="#6a4c7d" stroke="#2b2118" stroke-width="2"/>
<text x="1184.0" y="434" font-size="22" fill="#6a4c7d" text-anchor="middle" font-weight="bold" font-style="normal">2008</text>
<text x="1184.0" y="458.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">William Irvine publishes</text>
<text x="1184.0" y="476.8" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">A Guide to the</text>
<text x="1184.0" y="495.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Good Life</text>
<line x1="1305.0" y1="360" x2="1305.0" y2="298" stroke="#6a4c7d" stroke-width="2"/>
<circle cx="1305.0" cy="360" r="11" fill="#6a4c7d" stroke="#2b2118" stroke-width="2"/>
<text x="1305.0" y="203.5" font-size="22" fill="#6a4c7d" text-anchor="middle" font-weight="bold" font-style="normal">2012</text>
<text x="1305.0" y="227.5" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">First Stoic Week</text>
<text x="1305.0" y="246.2" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">held by the Modern</text>
<text x="1305.0" y="265.0" font-size="15" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Stoicism project</text>
<rect x="40" y="610" width="1320" height="60" fill="#f1e6cf" stroke="#b88a44"/>
<circle cx="70" cy="640" r="9" fill="#3f5b73" stroke="#2b2118" stroke-width="1.5"/><text x="88" y="646" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Early Stoa (Athens)</text>
<circle cx="390" cy="640" r="9" fill="#8c3b2e" stroke="#2b2118" stroke-width="1.5"/><text x="408" y="646" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Middle Stoa and Rome</text>
<circle cx="710" cy="640" r="9" fill="#5b6b3a" stroke="#2b2118" stroke-width="1.5"/><text x="728" y="646" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Roman Imperial Stoa</text>
<circle cx="1030" cy="640" r="9" fill="#6a4c7d" stroke="#2b2118" stroke-width="1.5"/><text x="1048" y="646" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Revival and modern influence</text>
<text x="1376" y="680" font-size="13" fill="#7a6a55" text-anchor="end">© The Great Library of Philosophy · libraryofphilosophy.com</text>
</svg>
