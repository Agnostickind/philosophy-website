<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" width="1400" height="820" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Existentialism concept map: core themes</title>
<desc id="d">Concept map with existence precedes essence at the centre, linked to eight themes: freedom, responsibility, anxiety, authenticity, bad faith, the absurd, death and finitude, and others and situation.</desc>
<rect width="1400" height="820" fill="#faf6ee"/>
<rect x="8" y="8" width="1384" height="804" fill="none" stroke="#b88a44" stroke-width="1.5"/>

<text x="40" y="62" font-size="29" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Existentialism: Core Themes at a Glance</text>
<text x="40" y="90" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Eight ideas that grow out of one starting point</text>
<line x1="380" y1="174.0" x2="600.7" y2="333.3" stroke="#3f5b73" stroke-width="2.5"/>
<line x1="380" y1="332.0" x2="534.3" y2="367.2" stroke="#8c3b2e" stroke-width="2.5"/>
<line x1="380" y1="490.0" x2="539.8" y2="447.5" stroke="#5b6b3a" stroke-width="2.5"/>
<line x1="380" y1="648.0" x2="604.2" y2="477.7" stroke="#6a4c7d" stroke-width="2.5"/>
<line x1="1020" y1="174.0" x2="799.3" y2="333.3" stroke="#9a6f2a" stroke-width="2.5"/>
<line x1="1020" y1="332.0" x2="865.7" y2="367.2" stroke="#2f6f6a" stroke-width="2.5"/>
<line x1="1020" y1="490.0" x2="860.2" y2="447.5" stroke="#3f5b73" stroke-width="2.5"/>
<line x1="1020" y1="648.0" x2="795.8" y2="477.7" stroke="#8c3b2e" stroke-width="2.5"/>
<ellipse cx="700" cy="405" rx="185" ry="85" fill="#5a3e1b" stroke="#b88a44" stroke-width="3"/>
<text x="700" y="391" font-size="26" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="italic">Existence</text>
<text x="700" y="419" font-size="26" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="italic">precedes essence</text>
<text x="700" y="447" font-size="14" fill="#e9d9b8" text-anchor="middle" font-weight="normal" font-style="italic">We make ourselves through our choices</text>
<rect x="40" y="115" width="340" height="118" fill="#f1e6cf" stroke="#3f5b73" stroke-width="2"/>
<rect x="40" y="115" width="340" height="7" fill="#3f5b73"/>
<text x="58" y="153" font-size="21" fill="#3f5b73" text-anchor="start" font-weight="bold" font-style="normal">Freedom</text>
<text x="58" y="181" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">We are not defined in advance;</text>
<text x="58" y="203" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">we become who we are by choosing.</text>
<rect x="40" y="273" width="340" height="118" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<rect x="40" y="273" width="340" height="7" fill="#8c3b2e"/>
<text x="58" y="311" font-size="21" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">Responsibility</text>
<text x="58" y="339" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Free choice means owning it: no</text>
<text x="58" y="361" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">excuses from fate or “human nature.”</text>
<rect x="40" y="431" width="340" height="118" fill="#f1e6cf" stroke="#5b6b3a" stroke-width="2"/>
<rect x="40" y="431" width="340" height="7" fill="#5b6b3a"/>
<text x="58" y="469" font-size="21" fill="#5b6b3a" text-anchor="start" font-weight="bold" font-style="normal">Anxiety (angst)</text>
<text x="58" y="497" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Seeing our open possibilities brings</text>
<text x="58" y="519" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">dread, which can reveal the self.</text>
<rect x="40" y="589" width="340" height="118" fill="#f1e6cf" stroke="#6a4c7d" stroke-width="2"/>
<rect x="40" y="589" width="340" height="7" fill="#6a4c7d"/>
<text x="58" y="627" font-size="21" fill="#6a4c7d" text-anchor="start" font-weight="bold" font-style="normal">Authenticity</text>
<text x="58" y="655" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Owning our choices instead of</text>
<text x="58" y="677" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">following the crowd or a script.</text>
<rect x="1020" y="115" width="340" height="118" fill="#f1e6cf" stroke="#9a6f2a" stroke-width="2"/>
<rect x="1020" y="115" width="340" height="7" fill="#9a6f2a"/>
<text x="1038" y="153" font-size="21" fill="#9a6f2a" text-anchor="start" font-weight="bold" font-style="normal">Bad faith</text>
<text x="1038" y="181" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Self-deception: hiding behind roles</text>
<text x="1038" y="203" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">or excuses to deny our freedom.</text>
<rect x="1020" y="273" width="340" height="118" fill="#f1e6cf" stroke="#2f6f6a" stroke-width="2"/>
<rect x="1020" y="273" width="340" height="7" fill="#2f6f6a"/>
<text x="1038" y="311" font-size="21" fill="#2f6f6a" text-anchor="start" font-weight="bold" font-style="normal">The Absurd</text>
<text x="1038" y="339" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">The clash between our hunger for</text>
<text x="1038" y="361" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">meaning and a silent universe.</text>
<rect x="1020" y="431" width="340" height="118" fill="#f1e6cf" stroke="#3f5b73" stroke-width="2"/>
<rect x="1020" y="431" width="340" height="7" fill="#3f5b73"/>
<text x="1038" y="469" font-size="21" fill="#3f5b73" text-anchor="start" font-weight="bold" font-style="normal">Death and finitude</text>
<text x="1038" y="497" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Knowing we will die gives urgency</text>
<text x="1038" y="519" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">and shape to how we live.</text>
<rect x="1020" y="589" width="340" height="118" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<rect x="1020" y="589" width="340" height="7" fill="#8c3b2e"/>
<text x="1038" y="627" font-size="21" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">Others and situation</text>
<text x="1038" y="655" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">We act among other people, in a</text>
<text x="1038" y="677" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">concrete world we did not choose.</text>
<rect x="40" y="760" width="1320" height="40" fill="#f1e6cf" stroke="#b88a44"/>
<text x="700" y="786" font-size="17" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Result: meaning is not handed to us; we have to make it, and answer for it.</text>
<text x="1376" y="812" font-size="13" fill="#7a6a55" text-anchor="end">© The Great Library of Philosophy · libraryofphilosophy.com</text>
</svg>
