<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">What the existentialists said</title>
<desc id="d">Six cards on key thinkers linked to existentialism: Kierkegaard, Nietzsche, Heidegger, Sartre, Beauvoir and Camus, each with dates, a major work, a short key phrase and the core idea.</desc>
<rect width="1400" height="900" fill="#faf6ee"/>
<rect x="8" y="8" width="1384" height="884" fill="none" stroke="#b88a44" stroke-width="1.5"/>

<text x="40" y="62" font-size="29" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Existentialism: What the Philosophers Said</text>
<text x="40" y="90" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Six thinkers, one shared question: how should a free, mortal person live?</text>
<rect x="40" y="120" width="420" height="300" fill="#f1e6cf" stroke="#3f5b73" stroke-width="2"/>
<rect x="40" y="120" width="420" height="8" fill="#3f5b73"/>
<text x="62" y="168" font-size="24" fill="#3f5b73" text-anchor="start" font-weight="bold" font-style="normal">Søren Kierkegaard</text>
<text x="62" y="194" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1813–1855 · The Concept of Anxiety (1844)</text>
<line x1="62" y1="212" x2="438" y2="212" stroke="#3f5b73" stroke-width="1" opacity="0.5"/>
<text x="62" y="250" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">“The dizziness of freedom”</text>
<text x="62" y="295" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Truth must be lived, not just thought.</text>
<text x="62" y="323" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Anxiety reveals our freedom, and we</text>
<text x="62" y="351" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">must choose who to become.</text>
<rect x="490" y="120" width="420" height="300" fill="#f1e6cf" stroke="#8c3b2e" stroke-width="2"/>
<rect x="490" y="120" width="420" height="8" fill="#8c3b2e"/>
<text x="512" y="168" font-size="24" fill="#8c3b2e" text-anchor="start" font-weight="bold" font-style="normal">Friedrich Nietzsche</text>
<text x="512" y="194" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1844–1900 · The Gay Science (1882)</text>
<line x1="512" y1="212" x2="888" y2="212" stroke="#8c3b2e" stroke-width="1" opacity="0.5"/>
<text x="512" y="250" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">“God is dead”</text>
<text x="512" y="295" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Old sources of meaning have lost their</text>
<text x="512" y="323" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">grip, so we must create new values</text>
<text x="512" y="351" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">and “become who we are.”</text>
<rect x="940" y="120" width="420" height="300" fill="#f1e6cf" stroke="#5b6b3a" stroke-width="2"/>
<rect x="940" y="120" width="420" height="8" fill="#5b6b3a"/>
<text x="962" y="168" font-size="24" fill="#5b6b3a" text-anchor="start" font-weight="bold" font-style="normal">Martin Heidegger</text>
<text x="962" y="194" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1889–1976 · Being and Time (1927)</text>
<line x1="962" y1="212" x2="1338" y2="212" stroke="#5b6b3a" stroke-width="1" opacity="0.5"/>
<text x="962" y="250" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">Being-toward-death</text>
<text x="962" y="295" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Human existence (Dasein) is finite. Facing</text>
<text x="962" y="323" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">our mortality lets us live authentically</text>
<text x="962" y="351" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">rather than as “the they.”</text>
<rect x="40" y="450" width="420" height="300" fill="#f1e6cf" stroke="#6a4c7d" stroke-width="2"/>
<rect x="40" y="450" width="420" height="8" fill="#6a4c7d"/>
<text x="62" y="498" font-size="24" fill="#6a4c7d" text-anchor="start" font-weight="bold" font-style="normal">Jean-Paul Sartre</text>
<text x="62" y="524" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1905–1980 · Being and Nothingness (1943)</text>
<line x1="62" y1="542" x2="438" y2="542" stroke="#6a4c7d" stroke-width="1" opacity="0.5"/>
<text x="62" y="580" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">“Existence precedes essence”</text>
<text x="62" y="625" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">We have no fixed nature in advance. We</text>
<text x="62" y="653" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">are radically free and responsible, and</text>
<text x="62" y="681" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">bad faith denies this.</text>
<rect x="490" y="450" width="420" height="300" fill="#f1e6cf" stroke="#9a6f2a" stroke-width="2"/>
<rect x="490" y="450" width="420" height="8" fill="#9a6f2a"/>
<text x="512" y="498" font-size="24" fill="#9a6f2a" text-anchor="start" font-weight="bold" font-style="normal">Simone de Beauvoir</text>
<text x="512" y="524" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1908–1986 · The Ethics of Ambiguity (1947)</text>
<line x1="512" y1="542" x2="888" y2="542" stroke="#9a6f2a" stroke-width="1" opacity="0.5"/>
<text x="512" y="580" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">Freedom needs others’ freedom</text>
<text x="512" y="625" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">We are free but situated in bodies and</text>
<text x="512" y="653" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">societies. Real freedom means willing</text>
<text x="512" y="681" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">the freedom of others too.</text>
<rect x="940" y="450" width="420" height="300" fill="#f1e6cf" stroke="#2f6f6a" stroke-width="2"/>
<rect x="940" y="450" width="420" height="8" fill="#2f6f6a"/>
<text x="962" y="498" font-size="24" fill="#2f6f6a" text-anchor="start" font-weight="bold" font-style="normal">Albert Camus</text>
<text x="962" y="524" font-size="14" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">1913–1960 · The Myth of Sisyphus (1942)</text>
<line x1="962" y1="542" x2="1338" y2="542" stroke="#2f6f6a" stroke-width="1" opacity="0.5"/>
<text x="962" y="580" font-size="18" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="italic">“One must imagine Sisyphus happy”</text>
<text x="962" y="625" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Life is absurd: we seek meaning in a</text>
<text x="962" y="653" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">silent universe. Revolt and full living,</text>
<text x="962" y="681" font-size="16" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">not despair. He rejected the label.</text>
<rect x="40" y="790" width="1320" height="62" fill="#5a3e1b" stroke="#b88a44" stroke-width="2"/>
<text x="700" y="827" font-size="20" fill="#faf6ee" text-anchor="middle" font-weight="bold" font-style="normal">Common thread: existence comes first, and meaning is made, not given.</text>
<text x="40" y="880" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Heidegger and Camus rejected the “existentialist” label; Nietzsche and Kierkegaard are earlier precursors.</text>
<text x="1376" y="880" font-size="13" fill="#7a6a55" text-anchor="end">© The Great Library of Philosophy · libraryofphilosophy.com</text>
</svg>
