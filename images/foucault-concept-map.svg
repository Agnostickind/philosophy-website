<rect x="670.6" y="676.0" width="218.8" height="58" rx="10" fill="#8c3b2e" stroke="#2b2118" stroke-width="1.5"/>
<text x="780" y="701.0" font-size="17" fill="#fff" text-anchor="middle" font-weight="bold" font-style="normal">Biopower</text>
<text x="780" y="722.0" font-size="12.5" fill="#f3ead9" text-anchor="middle" font-weight="normal" font-style="italic">History of Sexuality I, 1976</text>
