<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 870" width="1200" height="870" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Michel Foucault concept map</title>
<desc id="d">Concept map centered on power/knowledge, linking discourse, episteme, archaeology, genealogy, disciplinary power, the Panopticon, normalization, biopower, biopolitics, governmentality, subjectification and technologies of the self.</desc>
