<svg font-family="Georgia, 'DejaVu Serif', 'Times New Roman', serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="t d" width="1200" height="820" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">Aristotle’s Four Causes</title><desc id="d">Diagram of Aristotle’s four causes: material, formal, efficient and final, illustrated with a bronze statue. Library of Philosophy.</desc>
<rect width="1200" height="820" fill="#0f1420"/>
<rect x="18" y="18" width="1164" height="784" rx="14" fill="none" stroke="#c9a24b" stroke-width="1.5"/>
<text x="600" y="84" font-size="40" fill="#f2ead7" text-anchor="middle" font-weight="700">Aristotle’s Four Causes</text>
<text x="600" y="120" font-size="18" fill="#a9a89b" text-anchor="middle" font-style="italic">Four ways of answering the question “why?”  ·  Physics II.3 and Metaphysics V.2</text>
<line x1="450" y1="142" x2="750" y2="142" stroke="#c9a24b" stroke-width="2" stroke-linecap="round"/>
<line x1="600" y1="420" x2="490" y2="293.0" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="600" y1="420" x2="710" y2="293.0" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="600" y1="420" x2="490" y2="563.0" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<line x1="600" y1="420" x2="710" y2="563.0" stroke="#c9a24b" stroke-width="1.5" stroke-dasharray="6 6" stroke-linecap="round"/>
<circle cx="600" cy="420" r="80" fill="#0f1420" stroke="#c9a24b" stroke-width="2.5"/>
<text x="600" y="402" font-size="12" fill="#c9a24b" text-anchor="middle" font-weight="700" letter-spacing="2">EXAMPLE</text>
<text x="600" y="426" font-size="20" fill="#f2ead7" text-anchor="middle" font-weight="700">A bronze</text>
<text x="600" y="450" font-size="20" fill="#f2ead7" text-anchor="middle" font-weight="700">statue</text>
<rect x="60" y="168" width="430" height="250" rx="14" fill="#171e30" stroke="#d9944f" stroke-width="2"/>
<circle cx="102" cy="212" r="22" fill="#d9944f"/>
<text x="102" y="221" font-size="26" fill="#0f1420" text-anchor="middle" font-weight="700">1</text>
<text x="140" y="214" font-size="27" fill="#d9944f" text-anchor="start" font-weight="700">Material Cause</text>
<text x="140" y="240" font-size="15" fill="#a9a89b" text-anchor="start" font-style="italic">hylē  ·  “Out of what?”</text>
<line x1="84" y1="264" x2="466" y2="264" stroke="#d9944f" stroke-width="1" stroke-linecap="round"/>
<text x="86" y="296" font-size="17" fill="#f2ead7" text-anchor="start">The matter a thing is made from, the stuff</text>
<text x="86" y="320" font-size="17" fill="#f2ead7" text-anchor="start">that persists while it changes.</text>
<text x="86" y="370" font-size="12" fill="#d9944f" text-anchor="start" font-weight="700" letter-spacing="2">IN THE STATUE</text>
<text x="86" y="396" font-size="18" fill="#f2ead7" text-anchor="start" font-style="italic">The bronze of the statue.</text>
<rect x="710" y="168" width="430" height="250" rx="14" fill="#171e30" stroke="#6fb3d9" stroke-width="2"/>
<circle cx="752" cy="212" r="22" fill="#6fb3d9"/>
<text x="752" y="221" font-size="26" fill="#0f1420" text-anchor="middle" font-weight="700">2</text>
<text x="790" y="214" font-size="27" fill="#6fb3d9" text-anchor="start" font-weight="700">Formal Cause</text>
<text x="790" y="240" font-size="15" fill="#a9a89b" text-anchor="start" font-style="italic">eidos  ·  “What is it?”</text>
<line x1="734" y1="264" x2="1116" y2="264" stroke="#6fb3d9" stroke-width="1" stroke-linecap="round"/>
<text x="736" y="296" font-size="17" fill="#f2ead7" text-anchor="start">The form or essence that makes the matter</text>
<text x="736" y="320" font-size="17" fill="#f2ead7" text-anchor="start">be this kind of thing.</text>
<text x="736" y="370" font-size="12" fill="#6fb3d9" text-anchor="start" font-weight="700" letter-spacing="2">IN THE STATUE</text>
<text x="736" y="396" font-size="18" fill="#f2ead7" text-anchor="start" font-style="italic">The shape and design of the figure.</text>
<rect x="60" y="438" width="430" height="250" rx="14" fill="#171e30" stroke="#8fc98f" stroke-width="2"/>
<circle cx="102" cy="482" r="22" fill="#8fc98f"/>
<text x="102" y="491" font-size="26" fill="#0f1420" text-anchor="middle" font-weight="700">3</text>
<text x="140" y="484" font-size="27" fill="#8fc98f" text-anchor="start" font-weight="700">Efficient Cause</text>
<text x="140" y="510" font-size="15" fill="#a9a89b" text-anchor="start" font-style="italic">archē kinēseōs  ·  “Who made it?”</text>
<line x1="84" y1="534" x2="466" y2="534" stroke="#8fc98f" stroke-width="1" stroke-linecap="round"/>
<text x="86" y="566" font-size="17" fill="#f2ead7" text-anchor="start">The primary source of change, the agent</text>
<text x="86" y="590" font-size="17" fill="#f2ead7" text-anchor="start">that brings the thing about.</text>
<text x="86" y="640" font-size="12" fill="#8fc98f" text-anchor="start" font-weight="700" letter-spacing="2">IN THE STATUE</text>
<text x="86" y="666" font-size="18" fill="#f2ead7" text-anchor="start" font-style="italic">The sculptor and the sculptor’s craft.</text>
<rect x="710" y="438" width="430" height="250" rx="14" fill="#171e30" stroke="#d98fb0" stroke-width="2"/>
<circle cx="752" cy="482" r="22" fill="#d98fb0"/>
<text x="752" y="491" font-size="26" fill="#0f1420" text-anchor="middle" font-weight="700">4</text>
<text x="790" y="484" font-size="27" fill="#d98fb0" text-anchor="start" font-weight="700">Final Cause</text>
<text x="790" y="510" font-size="15" fill="#a9a89b" text-anchor="start" font-style="italic">telos  ·  “For what purpose?”</text>
<line x1="734" y1="534" x2="1116" y2="534" stroke="#d98fb0" stroke-width="1" stroke-linecap="round"/>
<text x="736" y="566" font-size="17" fill="#f2ead7" text-anchor="start">The end or purpose for the sake of which a</text>
<text x="736" y="590" font-size="17" fill="#f2ead7" text-anchor="start">thing exists or is done.</text>
<text x="736" y="640" font-size="12" fill="#d98fb0" text-anchor="start" font-weight="700" letter-spacing="2">IN THE STATUE</text>
<text x="736" y="666" font-size="18" fill="#f2ead7" text-anchor="start" font-style="italic">Honouring a hero.</text>
<text x="600" y="722" font-size="17" fill="#a9a89b" text-anchor="middle" font-style="italic">Aristotle’s own example of a final cause: health is the reason someone takes a walk.</text>
<line x1="500" y1="742" x2="700" y2="742" stroke="#c9a24b" stroke-width="1" stroke-linecap="round"/>
<text x="600" y="774" font-size="20" fill="#c9a24b" text-anchor="middle" font-weight="700">Library of Philosophy</text>
<text x="600" y="796" font-size="14" fill="#a9a89b" text-anchor="middle">https://libraryofphilosophy.com/aristotle.html</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>