<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Rajamandala: Kautilya's circle of states</title>
<desc id="d">Diagram of Kautilya's mandala theory: the conqueror Vijigishu at the centre of a row of states. Ahead lie the enemy, ally, enemy's ally, ally's ally and enemy's ally's ally; behind lie rear enemy, rear ally, and their allies. A middle king (Madhyama) and an indifferent king (Udasina) stand outside.</desc>
<rect width="1200" height="780" fill="#faf6ee"/>
<rect x="8" y="8" width="1184" height="764" fill="none" stroke="#b88a44" stroke-width="1.5"/>
<text x="40" y="60" font-size="27" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Rajamandala: Kautilya's Circle of States</text>
<text x="40" y="88" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">A map of who is likely to be a rival and who a friend around a king who wants to expand (Arthashastra, Book 6)</text>
<rect x="28" y="262" width="1144" height="262" rx="26" fill="none" stroke="#7a6a55" stroke-width="2" stroke-dasharray="9 7"/>
<text x="600" y="508" font-size="13.5" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">UDASINA: the indifferent king, outside the circle and stronger than all of them; can help or hinder</text>
<line x1="388" y1="300" x2="40" y2="300" stroke="#7a6a55" stroke-width="2"/>
<polygon points="33,300 45,294 45,306" fill="#7a6a55"/>
<text x="251.5" y="325" font-size="13" fill="#7a6a55" text-anchor="middle" font-weight="bold" font-style="normal">BEHIND (rear)</text>
<line x1="620" y1="300" x2="1129" y2="300" stroke="#7a6a55" stroke-width="2"/>
<polygon points="1136,300 1124,294 1124,306" fill="#7a6a55"/>
<text x="862.0" y="325" font-size="13" fill="#7a6a55" text-anchor="middle" font-weight="bold" font-style="normal">AHEAD (direction of expansion)</text>
<line x1="514.5" y1="205" x2="529" y2="353" stroke="#7a6a55" stroke-width="2" stroke-dasharray="5 5"/>
<line x1="654.5" y1="205" x2="640" y2="353" stroke="#7a6a55" stroke-width="2" stroke-dasharray="5 5"/>
<rect x="379.5" y="125" width="410" height="80" rx="14" fill="#f1e6cf" stroke="#7a6a55" stroke-width="2" stroke-dasharray="9 7"/>
<text x="584.5" y="153" font-size="16" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">MADHYAMA: the middle king</text>
<text x="584.5" y="174.0" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">Borders both Vijigishu and Ari and is stronger than</text>
<text x="584.5" y="191.5" font-size="12.5" fill="#2b2118" text-anchor="middle" font-weight="normal" font-style="normal">either. Can tip the balance.</text>
<circle cx="85" cy="385" r="32" fill="#3f5b73" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="85" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Akrandasara</text>
<text x="85" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Rear ally's</text>
<text x="85" y="473" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">ally</text>
<circle cx="196" cy="385" r="32" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="196" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Parshnigrahasara</text>
<text x="196" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Rear enemy's</text>
<text x="196" y="473" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">ally</text>
<circle cx="307" cy="385" r="32" fill="#3f5b73" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="307" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Akranda</text>
<text x="307" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Rear ally</text>
<circle cx="418" cy="385" r="32" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="418" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Parshnigraha</text>
<text x="418" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Rear enemy</text>
<circle cx="529" cy="385" r="32" fill="#b88a44" stroke="#5a3e1b" stroke-width="4"/>
<text x="529" y="393" font-size="22" fill="#2b2118" text-anchor="middle" font-weight="bold" font-style="normal">V</text>
<text x="529" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Vijigishu</text>
<text x="529" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">The would-be</text>
<text x="529" y="473" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">conqueror</text>
<circle cx="640" cy="385" r="32" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="640" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Ari</text>
<text x="640" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Enemy</text>
<text x="640" y="473" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">(neighbour)</text>
<circle cx="751" cy="385" r="32" fill="#3f5b73" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="751" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Mitra</text>
<text x="751" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Ally</text>
<circle cx="862" cy="385" r="32" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="862" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Arimitra</text>
<text x="862" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Enemy's ally</text>
<circle cx="973" cy="385" r="32" fill="#3f5b73" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="973" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Mitramitra</text>
<text x="973" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Ally's ally</text>
<circle cx="1084" cy="385" r="32" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="1084" y="443" font-size="11.5" fill="#5a3e1b" text-anchor="middle" font-weight="bold" font-style="normal">Arimitramitra</text>
<text x="1084" y="460" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">Enemy's ally's</text>
<text x="1084" y="473" font-size="11" fill="#7a6a55" text-anchor="middle" font-weight="normal" font-style="italic">ally</text>
<circle cx="60" cy="574" r="9" fill="#b88a44" stroke="#5a3e1b" stroke-width="1.5"/>
<text x="76" y="579" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Vijigishu (centre)</text>
<circle cx="270" cy="574" r="9" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="1.5"/>
<text x="286" y="579" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Natural rival side</text>
<circle cx="480" cy="574" r="9" fill="#3f5b73" stroke="#5a3e1b" stroke-width="1.5"/>
<text x="496" y="579" font-size="13" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Natural friend side</text>
<line x1="40" y1="600" x2="1160" y2="600" stroke="#b88a44" stroke-width="1"/>
<text x="40" y="632" font-size="14.5" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">1. Neighbours are rivals</text>
<text x="40" y="654.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">A state that shares your border is, by</text>
<text x="40" y="672.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">default, a likely enemy (Ari).</text>
<text x="415" y="632" font-size="14.5" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">2. The next ring is friendly</text>
<text x="415" y="654.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">A neighbour's neighbour is a likely ally</text>
<text x="415" y="672.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">(Mitra), and the pattern alternates.</text>
<text x="790" y="632" font-size="14.5" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">3. A model, not a destiny</text>
<text x="790" y="654.0" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">It describes relative power and interest;</text>
<text x="790" y="672.2" font-size="13" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="normal">real alliances shift with circumstances.</text>
<text x="40" y="742" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Twelve kings in all: the Vijigishu, five rival-side and four friend-side kings, plus the Madhyama and the Udasina.</text>
</svg>
