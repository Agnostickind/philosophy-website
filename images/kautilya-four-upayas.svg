<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Chaturupaya: the four means of statecraft (Kautilya)</title>
<desc id="d">Staircase diagram of four rising steps: Sama conciliation, Dana gifts, Bheda division, and Danda force, with an arrow showing rising cost and risk.</desc>
<rect width="1200" height="780" fill="#faf6ee"/>
<rect x="8" y="8" width="1184" height="764" fill="none" stroke="#b88a44" stroke-width="1.5"/>
<text x="40" y="60" font-size="27" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Chaturupaya: The Four Means of Statecraft</text>
<text x="40" y="88" font-size="15" fill="#7a6a55" text-anchor="start" font-weight="normal" font-style="italic">Kautilya's toolkit for dealing with rivals and rebels, from the gentlest approach to the most forceful</text>
<rect x="50" y="370" width="262" height="250" rx="6" fill="#3f5b73" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="68" y="408" font-size="24" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">1. Sama</text>
<text x="68" y="432" font-size="15" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Conciliation</text>
<text x="68" y="466" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">Persuade, negotiate, make</text>
<text x="68" y="485" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">treaties, stress shared</text>
<text x="68" y="504" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">interests.</text>
<line x1="68" y1="528" x2="294" y2="528" stroke="#faf6ee" stroke-opacity="0.45" stroke-width="1"/>
<text x="68" y="550" font-size="12" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">Today's echo</text>
<text x="68" y="568" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Diplomacy, mediation, a calm</text>
<text x="68" y="585" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">conversation that settles a</text>
<text x="68" y="602" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">dispute.</text>
<rect x="330" y="300" width="262" height="320" rx="6" fill="#b88a44" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="348" y="338" font-size="24" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">2. Dana</text>
<text x="348" y="362" font-size="15" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Gifts</text>
<text x="348" y="396" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">Offer rewards, concessions or</text>
<text x="348" y="415" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="normal">favours to win cooperation.</text>
<line x1="348" y1="528" x2="574" y2="528" stroke="#2b2118" stroke-opacity="0.45" stroke-width="1"/>
<text x="348" y="550" font-size="12" fill="#2b2118" text-anchor="start" font-weight="bold" font-style="normal">Today's echo</text>
<text x="348" y="568" font-size="12.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">Discounts, bonuses, trade</text>
<text x="348" y="585" font-size="12.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">concessions, aid packages.</text>
<rect x="610" y="230" width="262" height="390" rx="6" fill="#7a6a55" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="628" y="268" font-size="24" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">3. Bheda</text>
<text x="628" y="292" font-size="15" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Division</text>
<text x="628" y="326" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">Split a rival's allies and</text>
<text x="628" y="345" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">officials; exploit internal</text>
<text x="628" y="364" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">differences.</text>
<line x1="628" y1="528" x2="854" y2="528" stroke="#faf6ee" stroke-opacity="0.45" stroke-width="1"/>
<text x="628" y="550" font-size="12" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">Today's echo</text>
<text x="628" y="568" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Divide-and-rule tactics in</text>
<text x="628" y="585" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">politics or business competition.</text>
<rect x="890" y="160" width="262" height="460" rx="6" fill="#8c3b2e" stroke="#5a3e1b" stroke-width="2.5"/>
<text x="908" y="198" font-size="24" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">4. Danda</text>
<text x="908" y="222" font-size="15" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Force</text>
<text x="908" y="256" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">Use punishment or military</text>
<text x="908" y="275" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">power when other means fail or</text>
<text x="908" y="294" font-size="13.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="normal">are unsuitable.</text>
<line x1="908" y1="528" x2="1134" y2="528" stroke="#faf6ee" stroke-opacity="0.45" stroke-width="1"/>
<text x="908" y="550" font-size="12" fill="#faf6ee" text-anchor="start" font-weight="bold" font-style="normal">Today's echo</text>
<text x="908" y="568" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">Fines, sanctions, enforcement, and</text>
<text x="908" y="585" font-size="12.5" fill="#faf6ee" text-anchor="start" font-weight="normal" font-style="italic">in the extreme, war.</text>
<line x1="50" y1="660" x2="1130" y2="660" stroke="#5a3e1b" stroke-width="3"/>
<polygon points="1146,660 1128,651 1128,669" fill="#5a3e1b"/>
<text x="50" y="686" font-size="14" fill="#5a3e1b" text-anchor="start" font-weight="bold" font-style="normal">Rising cost, risk and difficulty of undoing the result</text>
<line x1="40" y1="708" x2="1160" y2="708" stroke="#b88a44" stroke-width="1"/>
<text x="40" y="734" font-size="13.5" fill="#2b2118" text-anchor="start" font-weight="normal" font-style="italic">The usual ordering is a teaching sequence. In practice the choice depends on relative strength, time and place; the upayas are also used together.</text>
</svg>
